name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_alreef
          POSTGRES_USER: alreef
          POSTGRES_PASSWORD: alreef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alreef -d test_alreef"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test_alreef
      DB_USER: alreef
      DB_PASSWORD: alreef
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/testing.txt

      - name: Install dependencies
        run: pip install -r requirements/testing.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: pytest tests/ -v --cov=apps --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  openapi-schema:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alreef
          POSTGRES_USER: alreef
          POSTGRES_PASSWORD: alreef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alreef -d alreef"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: localhost
      DB_NAME: alreef
      DB_USER: alreef
      DB_PASSWORD: alreef
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements/development.txt
      - run: pip install -r requirements/development.txt
      - name: OpenAPI schema generates and validates
        run: python manage.py spectacular --file /tmp/schema.yml --validate
