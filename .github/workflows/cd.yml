# Backend continuous delivery.
#
# Publishes the production image to GHCR on every green push to main, and then
# deploys it — but only once someone has switched deployment on.
#
# The VPS does not exist yet. Rather than leave commented-out YAML that nobody
# can tell is broken, the deploy job is real and gated on the repository variable
# DEPLOY_ENABLED. Until that is set to "true" the job is skipped, so the
# publishing half runs and is exercised on every merge; the day the server is
# ready, deployment is a variable and four secrets, not a rewrite.
#
# To turn it on:
#   Settings -> Secrets and variables -> Actions
#     Variables:  DEPLOY_ENABLED = true
#     Secrets:    VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_APP_DIR
#
# Secrets are referenced only inside `with:`/`env:` of the ssh step, never echoed.

name: CD

on:
  push:
    branches: ["main"]
    # Docs-only commits should not rebuild and redeploy the API.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "postman/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run the deploy step (requires DEPLOY_ENABLED and the VPS secrets)"
        type: boolean
        default: false

concurrency:
  # Never two deploys at once, and never cancel one midway — a half-applied
  # migration is far worse than a queued release.
  group: cd-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The image is only published if the suite passed for this commit. `workflow_run`
  # would be the other way to express it; calling the tests as a required job keeps
  # the whole chain visible in one run.
  verify:
    name: Tests must pass first
    uses: ./.github/workflows/tests.yml

  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The token GitHub mints for this run. No long-lived registry
          # credential is stored anywhere.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `sha-<commit>` is the tag the deploy pins to: `latest` is ambiguous
          # the moment two merges land close together, and a rollback needs to
          # name an exact build.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REQUIREMENTS_FILE=requirements/production.txt
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: publish
    # Skipped until the server exists. See the header for what to set.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.deploy)
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Pull the new image and restart the stack
        uses: appleboy/ssh-action@v1
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"

            # Pin the exact build this run produced. Writing it to .env means the
            # running stack and the git history agree on what is deployed, and a
            # rollback is the previous value rather than a guess.
            grep -v '^API_IMAGE=' .env > .env.next || true
            echo "API_IMAGE=${IMAGE}" >> .env.next
            mv .env.next .env

            docker compose pull api celery celery-beat
            # Migrations run in a one-shot container before anything serves, so a
            # request never hits a schema the code does not expect.
            docker compose run --rm api python manage.py migrate --noinput
            docker compose up -d --no-deps api celery celery-beat

            # Fail the deploy if the new container does not become healthy, so
            # the run goes red instead of silently leaving a broken release up.
            for i in $(seq 1 30); do
              state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q api)" 2>/dev/null || echo starting)
              [ "$state" = "healthy" ] && { echo "api is healthy"; break; }
              [ "$i" = "30" ] && { echo "api never became healthy"; docker compose logs --tail=80 api; exit 1; }
              sleep 5
            done

            docker image prune -f
