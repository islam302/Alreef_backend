{% comment %}
Every customer email is Arabic and right-to-left. `dir` and `lang` sit on the
wrapping div as well as on <html>, because several webmail clients strip
<html> and <body> and keep only what is inside them. Styles are inline for the
same reason: most clients ignore a <style> block. The colours are the
storefront's own tokens (forest, paper, ink, clay) - no new ones.
{% endcomment %}<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site_name }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f1e7;">
<div dir="rtl" lang="ar" style="direction:rtl;text-align:right;background:#f5f1e7;padding:24px 12px;font-family:Tahoma,Arial,sans-serif;color:#253b34;line-height:1.8;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #ece6d7;">
    <div style="background:#174b3a;padding:18px 24px;">
      <a href="{{ frontend_url }}" style="color:#ffffff;text-decoration:none;font-size:22px;font-weight:bold;">الريف</a>
    </div>
    <div style="padding:24px;font-size:16px;">
      {% block content %}{% endblock %}
    </div>
    <div style="padding:16px 24px;border-top:1px solid #ece6d7;color:#6b7a73;font-size:12px;">
      {{ site_name }} &middot; <a href="{{ frontend_url }}" style="color:#174b3a;">{{ frontend_url }}</a>
    </div>
  </div>
</div>
</body>
</html>
