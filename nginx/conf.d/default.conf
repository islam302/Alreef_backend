upstream django_backend {
    server web:8000;
}

client_max_body_size 10M;

server {
    listen 80;
    server_name _;

    # /static/ and /media/ are served directly by nginx via `alias` and
    # never pass through Django's SecurityMiddleware, so its headers
    # (nosniff, frame-deny, referrer policy) must be set here explicitly —
    # otherwise user-uploaded media (reviews/products/avatars) is served
    # with no hardening headers at all.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
        # User-uploaded content must never execute as a script — belt and
        # suspenders alongside the strict validate_image_file() checks.
        add_header Content-Disposition "inline" always;
    }

    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
